<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for capital allocation"><title>The context for capital allocation</title><rect width="960" height="540" fill="#0D2425"/><g font-family="Carlito, Calibri, sans-serif"><text x="52" y="33.24" font-size="11" fill="#B6C3AF" xml:space="preserve"><tspan font-weight="400" font-style="normal">EVALUATE THE PILOT BEFORE FUNDING SCALE  /  CONTEXT</tspan></text><text x="52" y="95.28" font-size="42" fill="#F5F2DE" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for capital allocation</tspan></text><text x="52" y="202.48" font-size="22" fill="#F5F2DE" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. The proposal assumes </tspan></text><text x="52" y="229.32" font-size="22" fill="#F5F2DE" xml:space="preserve"><tspan font-weight="400" font-style="normal">adoption without an observed workflow.</tspan></text><line x1="52" y1="502" x2="908" y2="502.5" stroke="#B6C3AF" stroke-width="0.5"/><text x="52" y="520.4" font-size="10" fill="#B6C3AF" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="863" y="520.4" font-size="10" fill="#B6C3AF" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>