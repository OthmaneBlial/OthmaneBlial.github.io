<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for market selection"><title>The context for market selection</title><rect width="960" height="540" fill="#F8F7F3"/><g font-family="Carlito, Calibri, sans-serif"><text x="52" y="33.24" font-size="11" fill="#566473" xml:space="preserve"><tspan font-weight="400" font-style="normal">FIND THE REACHABLE FIRST MARKET  /  CONTEXT</tspan></text><text x="52" y="88.56" font-size="34" fill="#252F3A" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for market selection</tspan></text><text x="52" y="200.8" font-size="20" fill="#252F3A" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. Broad market estimates do not </tspan></text><text x="52" y="225.20000000000002" font-size="20" fill="#252F3A" xml:space="preserve"><tspan font-weight="400" font-style="normal">reveal an accessible first customer.</tspan></text><line x1="52" y1="502" x2="908" y2="502.5" stroke="#566473" stroke-width="0.5"/><text x="52" y="520.4" font-size="10" fill="#566473" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="863" y="520.4" font-size="10" fill="#566473" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>