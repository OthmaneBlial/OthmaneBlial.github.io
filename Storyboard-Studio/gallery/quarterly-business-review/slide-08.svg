<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Next action: approve the pilot and own the review"><title>Next action: approve the pilot and own the review</title><rect width="960" height="540" fill="#FFFFFF"/><g font-family="Carlito, Calibri, sans-serif"><text x="44" y="33.24" font-size="11" fill="#4F667B" xml:space="preserve"><tspan font-weight="400" font-style="normal">A QUARTER OF FOCUS, NOT A LIST OF ACTIVITIES  /  ACTION</tspan></text><text x="44" y="88.56" font-size="34" fill="#182F48" xml:space="preserve"><tspan font-weight="700" font-style="normal">Next action: approve the pilot and own the review</tspan></text><rect x="44" y="184" width="427" height="284" rx="8" fill="#EBF1F7" stroke="none" stroke-width="1"/><text x="60" y="218.48" font-size="22" fill="#182F48" xml:space="preserve"><tspan font-weight="700" font-style="normal">Owner</tspan></text><text x="60" y="288.8" font-size="20" fill="#182F48" xml:space="preserve"><tspan font-weight="400" font-style="normal">Operations lead owns the first milestone and its </tspan></text><text x="60" y="313.2" font-size="20" fill="#182F48" xml:space="preserve"><tspan font-weight="400" font-style="normal">evidence.</tspan></text><rect x="489" y="184" width="427" height="284" rx="8" fill="#EBF1F7" stroke="none" stroke-width="1"/><text x="505" y="218.48" font-size="22" fill="#182F48" xml:space="preserve"><tspan font-weight="700" font-style="normal">Review</tspan></text><text x="505" y="288.8" font-size="20" fill="#182F48" xml:space="preserve"><tspan font-weight="400" font-style="normal">Inspect the pilot evidence before approving the </tspan></text><text x="505" y="313.2" font-size="20" fill="#182F48" xml:space="preserve"><tspan font-weight="400" font-style="normal">next stage.</tspan></text><line x1="44" y1="502" x2="916" y2="502.5" stroke="#4F667B" stroke-width="0.5"/><text x="44" y="520.4" font-size="10" fill="#4F667B" xml:space="preserve"><tspan font-weight