<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for workflow design"><title>The context for workflow design</title><rect width="960" height="540" fill="#FDF9F2"/><g font-family="Carlito, Calibri, sans-serif"><text x="56" y="33.24" font-size="11" fill="#665E53" xml:space="preserve"><tspan font-weight="400" font-style="normal">MAKE THE NEXT STEP VISIBLE  /  CONTEXT</tspan></text><text x="56" y="100.32" font-size="48" fill="#241F19" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for workflow design</tspan></text><text x="56" y="204.16" font-size="24" fill="#241F19" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. Readers see </tspan></text><text x="56" y="233.44" font-size="24" fill="#241F19" xml:space="preserve"><tspan font-weight="400" font-style="normal">many controls without knowing which action advances the task.</tspan></text><line x1="56" y1="502" x2="904" y2="502.5" stroke="#665E53" stroke-width="0.5"/><text x="56" y="520.4" font-size="10" fill="#665E53" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="859" y="520.4" font-size="10" fill="#665E53" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>