<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for project kickoff"><title>The context for project kickoff</title><rect width="960" height="540" fill="#FAFAF7"/><g font-family="Carlito, Calibri, sans-serif"><text x="48" y="33.24" font-size="11" fill="#566052" xml:space="preserve"><tspan font-weight="400" font-style="normal">START WITH AN OWNED DECISION  /  ACTION</tspan></text><text x="48" y="90.24" font-size="36" fill="#202820" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for project kickoff</tspan></text><text x="48" y="202.48" font-size="22" fill="#202820" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. The kickoff describes </tspan></text><text x="48" y="229.32" font-size="22" fill="#202820" xml:space="preserve"><tspan font-weight="400" font-style="normal">ambition without an owner or stop condition.</tspan></text><line x1="48" y1="502" x2="912" y2="502.5" stroke="#566052" stroke-width="0.5"/><text x="48" y="520.4" font-size="10" fill="#566052" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="867" y="520.4" font-size="10" fill="#566052" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>