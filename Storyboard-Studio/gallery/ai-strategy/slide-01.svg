<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for AI adoption"><title>The context for AI adoption</title><rect width="960" height="540" fill="#101C22"/><g font-family="Carlito, Calibri, sans-serif"><text x="40" y="33.24" font-size="11" fill="#9EB7B6" xml:space="preserve"><tspan font-weight="400" font-style="normal">WHERE AI EARNS A PLACE IN THE WORKFLOW  /  OPTIONS</tspan></text><text x="40" y="86.88" font-size="32" fill="#E5F0EE" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for AI adoption</tspan></text><text x="40" y="200.8" font-size="20" fill="#E5F0EE" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. The team has prototypes but no </tspan></text><text x="40" y="225.20000000000002" font-size="20" fill="#E5F0EE" xml:space="preserve"><tspan font-weight="400" font-style="normal">agreed evaluation boundary.</tspan></text><line x1="40" y1="502" x2="920" y2="502.5" stroke="#9EB7B6" stroke-width="0.5"/><text x="40" y="520.4" font-size="10" fill="#9EB7B6" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="875" y="520.4" font-size="10" fill="#9EB7B6" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>