<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for native presentation tooling"><title>The context for native presentation tooling</title><rect width="960" height="540" fill="#FDF9F2"/><g font-family="Carlito, Calibri, sans-serif"><text x="56" y="33.24" font-size="11" fill="#665E53" xml:space="preserve"><tspan font-weight="400" font-style="normal">STORYBOARD STUDIO — AN INSPECTABLE PRESENTATION COMPILER  /  CONTEXT</tspan></text><text x="56" y="99.47999999999999" font-size="47" fill="#241F19" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for native presentation tooling</tspan></text><text x="56" y="204.16" font-size="24" fill="#241F19" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. A polished </tspan></text><text x="56" y="233.44" font-size="24" fill="#241F19" xml:space="preserve"><tspan font-weight="400" font-style="normal">slide does not explain where its claims or layout came from.</tspan></text><line x1="56" y1="502" x2="904" y2="502.5" stroke="#665E53" stroke-width="0.5"/><text x="56" y="520.4" font-size="10" fill="#665E53" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="859" y="520.4" font-size="10" fill="#665E53" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>