<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="A smaller boundary makes the work reviewable"><title>A smaller boundary makes the work reviewable</title><rect width="960" height="540" fill="#F8F7F3"/><g font-family="Carlito, Calibri, sans-serif"><text x="52" y="33.24" font-size="11" fill="#566473" xml:space="preserve"><tspan font-weight="400" font-style="normal">WHAT THE PILOT CAN AND CANNOT TELL US  /  PROBLEM</tspan></text><text x="52" y="88.56" font-size="34" fill="#252F3A" xml:space="preserve"><tspan font-weight="700" font-style="normal">A smaller boundary makes the work reviewable</tspan></text><rect x="52" y="184" width="273.3333333333333" height="276" rx="8" fill="#E8ECED" stroke="none" stroke-width="1"/><text x="68" y="218.48" font-size="22" fill="#252F3A" xml:space="preserve"><tspan font-weight="700" font-style="normal">Observe</tspan></text><text x="68" y="288.8" font-size="20" fill="#252F3A" xml:space="preserve"><tspan font-weight="400" font-style="normal">Start with one actual task.</tspan></text><rect x="343.3333333333333" y="184" width="273.3333333333333" height="276" rx="8" fill="#E8ECED" stroke="none" stroke-width="1"/><text x="359.3333333333333" y="218.48" font-size="22" fill="#252F3A" xml:space="preserve"><tspan font-weight="700" font-style="normal">Decide</tspan></text><text x="359.3333333333333" y="288.8" font-size="20" fill="#252F3A" xml:space="preserve"><tspan font-weight="400" font-style="normal">Name the trade-off and </tspan></text><text x="359.3333333333333" y="313.2" font-size="20" fill="#252F3A" xml:space="preserve"><tspan font-weight="400" font-style="normal">owner.</tspan></text><rect x="634.6666666666666" y="184" width="273.3333333333333" height="276" rx="8" fill="#E8ECED" stroke="none" stroke-width="1"/><text x="650.6666666666666" y="218.48" font-size="22" fill="#252F3A" xml:space="preserve"><tspan font-weight="700" font-style="normal">Review</tspan></text><text x="650.6666666666666" y="288.8" font-size="20" fill="#252F3A" xml:space="preserve"><tspan font-weight="400" font-style="normal">Inspect the outcome before </tspan></text><text x="650.6666666666666" y="313.2" font-size="20" fill="#252F3A" xml:space="preserve"><tspan font-weight="400" font-style="normal">expanding.</tspan></text><line x1="52" y1="502" x2="908" y2="502.5" stroke="#566473" stroke-width="0.5"/><text x="52" y="520.4" font-size="10" fill="#566473" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="863" y="520.4" font-size="10" fill="#566473" xml:space="preserve"><tspan font-weight="400" font-style="normal">03</tspan></text></g></svg>