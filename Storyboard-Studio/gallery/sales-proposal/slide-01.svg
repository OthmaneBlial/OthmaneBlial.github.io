<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for solution delivery"><title>The context for solution delivery</title><rect width="960" height="540" fill="#F4EDE0"/><g font-family="Carlito, Calibri, sans-serif"><text x="56" y="33.24" font-size="11" fill="#68594A" xml:space="preserve"><tspan font-weight="400" font-style="normal">A PROPOSAL BUILT AROUND ONE CUSTOMER OUTCOME  /  CONTEXT</tspan></text><text x="56" y="96.96000000000001" font-size="44" fill="#30251D" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for solution delivery</tspan></text><text x="56" y="204.16" font-size="24" fill="#30251D" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. The proposal </tspan></text><text x="56" y="233.44" font-size="24" fill="#30251D" xml:space="preserve"><tspan font-weight="400" font-style="normal">lists features without explaining the delivery trade-off.</tspan></text><line x1="56" y1="502" x2="904" y2="502.5" stroke="#68594A" stroke-width="0.5"/><text x="56" y="520.4" font-size="10" fill="#68594A" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="859" y="520.4" font-size="10" fill="#68594A" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>