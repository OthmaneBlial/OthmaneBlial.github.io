<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for data migration"><title>The context for data migration</title><rect width="960" height="540" fill="#F7F7F7"/><g font-family="Carlito, Calibri, sans-serif"><text x="48" y="33.24" font-size="11" fill="#595959" xml:space="preserve"><tspan font-weight="400" font-style="normal">A MIGRATION BOUNDARY THE TEAM CAN TEST  /  CONTEXT</tspan></text><text x="48" y="86.88" font-size="32" fill="#202020" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for data migration</tspan></text><text x="48" y="200.8" font-size="20" fill="#202020" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. Replacing the storage layer and </tspan></text><text x="48" y="225.20000000000002" font-size="20" fill="#202020" xml:space="preserve"><tspan font-weight="400" font-style="normal">API simultaneously makes rollback unclear.</tspan></text><line x1="48" y1="502" x2="912" y2="502.5" stroke="#595959" stroke-width="0.5"/><text x="48" y="520.4" font-size="10" fill="#595959" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="867" y="520.4" font-size="10" fill="#595959" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>