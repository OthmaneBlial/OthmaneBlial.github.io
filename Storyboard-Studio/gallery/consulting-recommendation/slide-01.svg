<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for operating model"><title>The context for operating model</title><rect width="960" height="540" fill="#FFFFFF"/><g font-family="Carlito, Calibri, sans-serif"><text x="44" y="33.24" font-size="11" fill="#4F667B" xml:space="preserve"><tspan font-weight="400" font-style="normal">CHOOSE THE OPERATING MODEL THE TEAM CAN SUSTAIN  /  CONTEXT</tspan></text><text x="44" y="88.56" font-size="34" fill="#182F48" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for operating model</tspan></text><text x="44" y="200.8" font-size="20" fill="#182F48" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. A centralized queue slows </tspan></text><text x="44" y="225.20000000000002" font-size="20" fill="#182F48" xml:space="preserve"><tspan font-weight="400" font-style="normal">decisions that need local context.</tspan></text><line x1="44" y1="502" x2="916" y2="502.5" stroke="#4F667B" stroke-width="0.5"/><text x="44" y="520.4" font-size="10" fill="#4F667B" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="871" y="520.4" font-size="10" fill="#4F667B" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>