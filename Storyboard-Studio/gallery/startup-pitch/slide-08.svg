<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Risks to review before expansion"><title>Risks to review before expansion</title><rect width="960" height="540" fill="#141C26"/><g font-family="Carlito, Calibri, sans-serif"><text x="48" y="33.24" font-size="11" fill="#A6B4C2" xml:space="preserve"><tspan font-weight="400" font-style="normal">FIELDWORK — THE RESEARCH WORKSPACE  /  IMPLICATIONS</tspan></text><text x="48" y="93.6" font-size="40" fill="#EFF3F5" xml:space="preserve"><tspan font-weight="700" font-style="normal">Risks to review before expansion</tspan></text><text x="48" y="202.48" font-size="22" fill="#EFF3F5" xml:space="preserve"><tspan font-weight="400" font-style="normal">Keep the scope narrow. Check whether the new workflow adds manual effort or moves risk </tspan></text><text x="48" y="229.32" font-size="22" fill="#EFF3F5" xml:space="preserve"><tspan font-weight="400" font-style="normal">elsewhere. Record the unresolved question instead of treating an assumption as a finding.</tspan></text><line x1="48" y1="502" x2="912" y2="502.5" stroke="#A6B4C2" stroke-width="0.5"/><text x="48" y="520.4" font-size="10" fill="#A6B4C2" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="867" y="520.4" font-size="10" fill="#A6B4C2" xml:space="preserve"><tspan font-weight="400" font-style="normal">08</tspan></text></g></svg>