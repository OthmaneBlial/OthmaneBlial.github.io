<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Keep the reasoning inspectable"><title>Keep the reasoning inspectable</title><rect width="960" height="540" fill="#141C26"/><g font-family="Carlito, Calibri, sans-serif"><text x="48" y="33.24" font-size="11" fill="#A6B4C2" xml:space="preserve"><tspan font-weight="400" font-style="normal">FIELDWORK — THE RESEARCH WORKSPACE  /  IMPLICATIONS</tspan></text><text x="48" y="93.6" font-size="40" fill="#EFF3F5" xml:space="preserve"><tspan font-weight="700" font-style="normal">Keep the reasoning inspectable</tspan></text><text x="48" y="212.56" font-size="34" fill="#EFF3F5" xml:space="preserve"><tspan font-weight="400" font-style="normal">A decision should keep its supporting evidence and </tspan></text><text x="48" y="254.04" font-size="34" fill="#EFF3F5" xml:space="preserve"><tspan font-weight="400" font-style="normal">unresolved assumptions in view.</tspan></text><text x="48" y="442.48" font-size="22" fill="#A6B4C2" xml:space="preserve"><tspan font-weight="400" font-style="normal">Authored synthetic principle — not a customer quotation</tspan></text><line x1="48" y1="502" x2="912" y2="502.5" stroke="#A6B4C2" stroke-width="0.5"/><text x="48" y="520.4" font-size="10" fill="#A6B4C2" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="867" y="520.4" font-size="10" fill="#A6B4C2" xml:space="preserve"><tspan font-weight="400" font-style="normal">07</tspan></text></g></svg>