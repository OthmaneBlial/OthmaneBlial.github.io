<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for release planning"><title>The context for release planning</title><rect width="960" height="540" fill="#F6F6FB"/><g font-family="Carlito, Calibri, sans-serif"><text x="48" y="33.24" font-size="11" fill="#636178" xml:space="preserve"><tspan font-weight="400" font-style="normal">A ROADMAP WITH ROOM TO LEARN  /  CONTEXT</tspan></text><text x="48" y="93.6" font-size="40" fill="#25243A" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for release planning</tspan></text><text x="48" y="202.48" font-size="22" fill="#25243A" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. Too many parallel </tspan></text><text x="48" y="229.32" font-size="22" fill="#25243A" xml:space="preserve"><tspan font-weight="400" font-style="normal">initiatives obscure the next customer problem.</tspan></text><line x1="48" y1="502" x2="912" y2="502.5" stroke="#636178" stroke-width="0.5"/><text x="48" y="520.4" font-size="10" fill="#636178" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="867" y="520.4" font-size="10" fill="#636178" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>