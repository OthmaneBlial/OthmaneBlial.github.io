<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The context for incident recovery"><title>The context for incident recovery</title><rect width="960" height="540" fill="#0E1D14"/><g font-family="Carlito, Calibri, sans-serif"><text x="40" y="33.24" font-size="11" fill="#A2C5AA" xml:space="preserve"><tspan font-weight="400" font-style="normal">TURN A RECOVERY INTO A RELIABILITY DECISION  /  PROBLEM</tspan></text><text x="40" y="85.2" font-size="30" fill="#DEF4DF" xml:space="preserve"><tspan font-weight="700" font-style="normal">The context for incident recovery</tspan></text><text x="40" y="200.8" font-size="20" fill="#DEF4DF" xml:space="preserve"><tspan font-weight="400" font-style="normal">This fictional team needs a decision it can explain, execute, and revisit. The service recovered but the same </tspan></text><text x="40" y="225.20000000000002" font-size="20" fill="#DEF4DF" xml:space="preserve"><tspan font-weight="400" font-style="normal">dependency remains on the critical path.</tspan></text><line x1="40" y1="502" x2="920" y2="502.5" stroke="#A2C5AA" stroke-width="0.5"/><text x="40" y="520.4" font-size="10" fill="#A2C5AA" xml:space="preserve"><tspan font-weight="400" font-style="normal">SYNTHETIC EXAMPLE  ·  STORYBOARD STUDIO</tspan></text><text x="875" y="520.4" font-size="10" fill="#A2C5AA" xml:space="preserve"><tspan font-weight="400" font-style="normal">01</tspan></text></g></svg>